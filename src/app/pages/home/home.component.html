@if(!categories){  
    <app-spinner></app-spinner>
    <app-my-apk></app-my-apk>
}@else { 
    @for(category of categories; track category.id){
        <app-content [category]="category"></app-content>
    }
    <app-trends></app-trends>
    <div class="mt-3 md:-mt-4 mb-4">
        <app-my-apk></app-my-apk>
    </div>
    
}
